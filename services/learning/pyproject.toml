[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "learning"
version = "0.1.0"
description = "Planly adaptive learning service, durable worker and evaluation engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "uvicorn[standard]>=0.30.0",
    "starlette>=0.38.0",
    "anyio>=4.0.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "cryptography>=43.0.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "fsrs>=6.0.0",
    "numpy>=1.26.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["learning*"]
